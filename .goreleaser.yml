version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Linux amd64: CGO_ENABLED=1 for ONNX runtime (paddleocr-vl layout detection)
  - id: pdf2md-linux-amd64
    binary: pdf2md
    main: .
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # All platforms: CGO_ENABLED=0 (paddleocr-vl uses VLM fallback, no ONNX layout)
  - id: pdf2md-all
    binary: pdf2md
    main: .
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Linux/amd64 is already built with CGO=1 above
    ignore:
      - goos: linux
        goarch: amd64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ninehills
    name: pdf2md
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
